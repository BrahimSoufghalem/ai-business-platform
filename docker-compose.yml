services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_business
      POSTGRES_USER: ai_business
      POSTGRES_PASSWORD: ai_business
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_business -d ai_business']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
